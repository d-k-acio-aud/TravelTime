<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Time | Gallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
  <link rel="icon" type="image/png" href="/bla.png">
  <style>


    :root {
      --sidebar-width: 250px;
      --primary-color: #007bff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
    }

    .gallery-container {
      margin-left: var(--sidebar-width);
      padding: 40px 60px;
      background-color: #f9f9f9;
      min-height: 100vh;
    }

    .gallery-container h2 {
      font-weight: 600;
      color: #333;
      margin-bottom: 30px;
    }

    .grid-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .image-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .image-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .image-preview {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .image-info {
      padding: 10px 15px;
      font-size: 0.9rem;
      color: #555;
      text-align: center;
    }

    #noPhotosMessage {
      background: #fff;
      border-radius: 10px;
      padding: 60px 30px;
      margin-top: 40px;
      box-shadow: 0 2px 30px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

<!-- Подключаем sidebar -->
<div th:replace="fragments/side-bar :: sidebar"></div>

<div class="gallery-container">
  <h2>Your gallery</h2>

  <div id="noPhotosMessage" class="text-center text-muted py-5" style="display: none;">
    <i class="fas fa-image fa-3x mb-3" style="color: #ccc;"></i>
    <h4 class="mb-3">No photos yet</h4>
    <p>Start uploading memories from your trips to build your gallery.</p>
    <a href="/trips/new" class="btn btn-outline-primary d-inline-flex align-items-center gap-2 mt-3">
      <i class="fas fa-plus"></i>
      <span>Add a Trip</span>
    </a>
  </div>

  <div id="photoGallery" class="grid-wrapper">
    <!-- Photos load here -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script src="/js/photos.js" defer></script>
</body>
</html>
