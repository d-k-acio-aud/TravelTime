<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Trip | Travel Time' : 'Add Trip | Travel Time'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/bla.png">

    <style>
        :root {
            --primary-color: #4e73df;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            padding: 20px 0;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
        }

        .trip-form-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-title {
            color: var(--primary-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 10px 25px;
            font-weight: 600;
        }

        .btn-outline-secondary {
            padding: 10px 25px;
            font-weight: 600;
        }

        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px dashed #ddd;
        }

        .footer {
            margin-left: var(--sidebar-width);
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }

        .existing-photos {
            margin-bottom: 15px;
        }

        .existing-photo {
            position: relative;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .delete-photo-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
<!-- Sidebar fragment -->
<div th:replace="fragments/side-bar :: sidebar"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="trip-form-card">
        <h2 class="form-title">
            <i th:class="${editMode} ? 'fas fa-edit' : 'fas fa-plus-circle'" class="me-2"></i>
            <span th:text="${editMode} ? 'Edit Trip' : 'Add New Trip'"></span>
        </h2>

        <form id="tripForm">
            <input type="hidden" id="tripId" th:if="${trip != null}" th:value="${trip.id}">

            <div class="mb-4">
                <label for="tripName" class="form-label">Trip Name*</label>
                <input type="text" class="form-control" id="tripName"
                       th:value="${trip?.name}" required>
            </div>

            <div class="mb-4">
                <label for="destination" class="form-label">Destination*</label>
                <input type="text" class="form-control" id="destination"
                       th:value="${trip?.destination}" required>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="startDate" class="form-label">Start Date*</label>
                    <input type="date" class="form-control" id="startDate"
                           th:value="${trip?.startDate}" required>
                </div>
                <div class="col-md-6">
                    <label for="endDate" class="form-label">End Date*</label>
                    <input type="date" class="form-control" id="endDate"
                           th:value="${trip?.endDate}" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">Description*</label>
                <textarea class="form-control" id="description" rows="4"
                          th:text="${trip?.description}" required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Photos</label>

                <!-- Существующие фото (только в режиме редактирования) -->
                <div class="existing-photos" th:if="${editMode}">
                    <div class="d-flex flex-wrap" id="existingPhotosContainer">
                        <div class="existing-photo" th:each="photo : ${trip.photos}">
                            <img th:src="${photo.url}" class="image-preview">
                            <button type="button" class="delete-photo-btn"
                                    th:attr="data-photo-id=${photo.id}">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Загрузка новых фото -->
                <input type="file" class="form-control" id="photos" multiple accept="image/*">
                <div class="image-preview-container" id="imagePreview"></div>
            </div>

            <div class="d-flex justify-content-between mt-5">
                <div>
                    <!-- Кнопка Delete только в режиме редактирования -->
                    <button type="button" class="btn btn-outline-danger me-2"
                            th:if="${editMode}" id="deleteTripBtn">
                        <i class="fas fa-trash me-2"></i> Delete Trip
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="cancelBtn">
                        <i class="fas fa-times me-2"></i> Cancel
                    </button>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>
                    <span th:text="${editMode} ? 'Update' : 'Save'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <p>© 2023 Travel Time. All rights reserved.</p>
</footer>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/add-trip.js}" defer></script>
</body>
</html>
