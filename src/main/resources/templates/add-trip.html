<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Time | Add Trip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            padding: 20px 0;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
        }

        .trip-form-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-title {
            color: var(--primary-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 10px 25px;
            font-weight: 600;
        }

        .btn-outline-secondary {
            padding: 10px 25px;
            font-weight: 600;
        }

        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px dashed #ddd;
        }

        .footer {
            margin-left: var(--sidebar-width);
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            padding: 20px 0;
        }

        .sidebar-brand {
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .nav-link {
            padding: 12px 25px;
            color: #333;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background: #f1f1f1;
            border-left: 4px solid var(--primary-color);
            color: var(--primary-color);
        }

        .nav-link i {
            width: 25px;
            text-align: center;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-plane"></i> Travel Time
    </div>
    <nav class="nav flex-column mt-4">
        <a class="nav-link active" href="/home">
            <i class="fas fa-home"></i> Home
        </a>
        <a class="nav-link" href="/profile">
            <i class="fas fa-user"></i> Profile
        </a>
        <a class="nav-link" href="/friends">
            <i class="fas fa-users"></i> Friends
        </a>
        <a class="nav-link" href="/photos">
            <i class="fas fa-images"></i> Photos
        </a>
        <!-- В боковой панели замените форму на эту -->
        <form th:action="@{/api/auth/logout}" method="POST" class="mt-4 px-3">
            <button type="submit" class="nav-link w-100 text-start" style="background: none; border: none; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </form>

    </nav>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="trip-form-card">
        <h2 class="form-title"><i class="fas fa-plus-circle me-2"></i>Add New Trip</h2>

        <form id="tripForm">
            <div class="mb-4">
                <label for="tripName" class="form-label">Trip Name*</label>
                <input type="text" class="form-control" id="tripName" required>
            </div>

            <div class="mb-4">
                <label for="destination" class="form-label">Destination*</label>
                <input type="text" class="form-control" id="destination" required>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="startDate" class="form-label">Start Date*</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div class="col-md-6">
                    <label for="endDate" class="form-label">End Date*</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label">Description*</label>
                <textarea class="form-control" id="description" rows="4" required></textarea>
            </div>

            <div class="mb-4">
                <label for="photos" class="form-label">Photos</label>
                <input type="file" class="form-control" id="photos" multiple accept="image/*">
                <div class="image-preview-container" id="imagePreview"></div>
            </div>

            <div class="d-flex justify-content-between mt-5">
                <button type="button" class="btn btn-outline-secondary" id="cancelBtn">
                    <i class="fas fa-times me-2"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i> Save Trip
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <p>© 2023 Travel Time. All rights reserved.</p>
</footer>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/add-trip.js}" defer></script>
</body>
</html>
