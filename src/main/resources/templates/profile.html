<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Профиль</title>

    <!-- Bootstrap и иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Общие переменные -->
    <style>
        :root {
            --primary-color: #4e73df;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            flex: 1;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div th:replace="fragments/side-bar :: sidebar"></div>

<!-- Main Content -->
<div class="main-content">
    <h1 th:text="'Профиль: ' + ${username}"></h1>

    <div class="card mt-3" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="card-title" th:text="${username}"></h5>
            <p class="card-text">Здесь будет информация профиля</p>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
