<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Time | Home</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/bla.png">

    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fa;
            --sidebar-width: 250px;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: var(--secondary-color);
            margin: 0;
            color: #333;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            padding: 20px 0;
            z-index: 100;
        }

        .sidebar-brand {
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .nav-link {
            padding: 12px 25px;
            color: #555;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(78, 115, 223, 0.1);
            border-left: 4px solid var(--primary-color);
            color: var(--primary-color);
        }

        .nav-link i {
            width: 25px;
            text-align: center;
            margin-right: 10px;
            color: inherit;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 1.5rem;
            max-width: none; /* Убрано ограничение по ширине */
        }

        /* Welcome Section */
        .welcome-section {
            background: white;
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
        }

        .welcome-section h2 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 1.5rem;
        }

        /* Trip Cards - компактный вариант */
        .trip-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
        }

        .trip-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .trip-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, var(--primary-color), #3a56b0);
            color: white;
        }

        .trip-header h4 {
            margin: 0;
            font-weight: 600;
            font-size: 1.25rem;
        }

        .trip-dates {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.25rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .trip-body {
            padding: 1.25rem;
        }

        .trip-description {
            line-height: 1.6;
            color: #555;
            font-size: 1rem;
            margin-bottom: 1rem;
            white-space: pre-wrap;
        }

        /* Стили для фотографий */
        .image-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .image-preview-wrapper {
            position: relative;
            width: 100%;
            height: 150px;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            background: #f5f5f5;
        }

        .image-preview-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .image-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        .trip-footer {
            padding: 1rem 1.25rem;
            background: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
        }

        .trip-destination {
            display: flex;
            align-items: center;
            font-weight: 500;
            color: var(--primary-color);
            font-size: 1rem;
        }

        .trip-destination i {
            margin-right: 0.5rem;
            font-size: 1rem;
        }

        .trip-actions .btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
            border-radius: 6px;
        }

        /* No Trips */
        .no-trips {
            width: 100%;
            min-height: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .no-trips i {
            font-size: 3.5rem;
            color: #d0d0d0;
            margin-bottom: 1rem;
        }

        .no-trips h3 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .no-trips p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .no-trips .btn {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }




        /* Add Trip Button */
        .add-trip-btn {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 3px 10px rgba(78, 115, 223, 0.3);
            z-index: 90;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .add-trip-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.4);
            background: #3a56b0;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-plane"></i> Travel Time
    </div>
    <nav class="nav flex-column mt-4">
        <a class="nav-link active" href="/home">
            <i class="fas fa-home"></i> Home
        </a>
        <a class="nav-link" href="/profile">
            <i class="fas fa-user"></i> Profile
        </a>
        <a class="nav-link" href="/friends">
            <i class="fas fa-users"></i> Friends
        </a>
        <a class="nav-link" href="/photos">
            <i class="fas fa-images"></i> Photos
        </a>
        <form th:action="@{/api/auth/logout}" method="POST" class="mt-4 px-3">
            <button type="submit" class="nav-link w-100 text-start" style="background: none; border: none; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </form>
    </nav>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Welcome Section -->
    <div class="welcome-section">
        <h2>Welcome back, <span th:text="${username}"></span>!</h2>
        <p class="text-muted">You have <span th:text="${tripCount}"></span> trips recorded</p>
    </div>

    <!-- Trips Section -->
    <div th:if="${trips == null or trips.isEmpty()}">
        <div class="no-trips">
            <i class="fas fa-umbrella-beach"></i>
            <h3>No trips yet</h3>
            <p class="text-muted mb-3">Start your travel journey by adding your first trip!</p>
            <a href="/trips/new" class="btn btn-primary d-flex align-items-center gap-2" id="addFirstTrip">

                <span>Add Your First Trip</span>
            </a>
        </div>
    </div>

    <div th:unless="${trips == null or trips.isEmpty()}">
        <div class="trip-card" th:each="trip : ${trips}">
            <div class="trip-header">
                <h4 th:text="${trip.name}"></h4>
                <div class="trip-dates">
                    <span th:text="${trip.startDate}"></span>
                    <span>-</span>
                    <span th:text="${trip.endDate}"></span>
                </div>
            </div>

            <div class="trip-body">
                <p class="trip-description" th:text="${trip.description}"></p>

                <div class="image-preview-container" th:if="${not #lists.isEmpty(trip.photos)}">
                    <a th:each="photo : ${trip.photos}"
                       th:href="${photo.url}"
                       class="glightbox"
                       th:attr="data-gallery='trip-' + ${trip.id}">
                        <div class="image-preview-wrapper">
                            <img th:src="${photo.url}"
                                 class="image-preview"
                                 alt="Trip photo">
                        </div>
                    </a>
                </div>
            </div>

            <div class="trip-footer">
                <div class="trip-destination">
                    <i class="fas fa-map-marker-alt"></i>
                    <span th:text="${trip.destination}"></span>
                </div>
                <div class="trip-actions">
                    <a th:href="@{/trips/edit/{id}(id=${trip.id})}" class="btn btn-outline-primary">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Trip Button -->
<button class="add-trip-btn" title="Add New Trip" onclick="window.location.href='/trips/new'">
    <i class="fas fa-plus"></i>
</button>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/home.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const lightbox = GLightbox({
            selector: '.glightbox',
            touchNavigation: true,
            loop: true,
            openEffect: 'zoom',
            closeEffect: 'fade'
        });

        document.getElementById('addFirstTrip')?.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '/trips/new';
        });

        document.querySelector('form[action*="logout"]')?.addEventListener('submit', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to log out?')) {
                this.submit();
            }
        });
    });
</script>
</body>
</html>
