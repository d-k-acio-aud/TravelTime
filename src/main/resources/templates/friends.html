<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Time | Friends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #4e73df;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
        }

        .friends-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 25px;
            margin-bottom: 30px;
        }

        .friend-card {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s;
        }

        .friend-card:hover {
            background: #f8f9fa;
            transform: translateX(5px);
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .friend-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        .dropdown-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            padding: 10px;
        }

    </style>
</head>
<body>

<!-- Sidebar fragment -->
<div th:replace="fragments/side-bar :: sidebar"></div>

<!-- Main Content -->
<div class="main-content">
    <!-- Search Box -->

    <div class="search-box position-relative">
        <input type="text" class="search-input" placeholder="Search users..." id="searchInput">
        <i class="fas fa-search search-icon"></i>

        <!-- Dropdown -->
        <div id="searchDropdown" class="dropdown-results shadow" style="display: none;">
            <div id="searchResults"></div>
        </div>
    </div>

    <!-- Pending Requests -->
    <div class="friends-section" id="pendingSection">
        <h4 class="mb-4"><i class="fas fa-clock me-2"></i>Requests</h4>
        <div id="pendingList"></div>
    </div>

    <!-- Friends List -->
    <div class="friends-section">
        <h4 class="mb-4"><i class="fas fa-user-friends me-2"></i>Your Friends</h4>
        <div id="friendsList"></div>
    </div>
</div>



<!-- Templates -->
<template id="friendTemplate">
    <div class="friend-card">
        <img src="https://via.placeholder.com/50" class="friend-avatar" alt="User avatar">
        <div class="friend-info">
            <h5 class="friend-name mb-1"></h5>
            <small class="text-muted friend-username"></small>
        </div>
        <div class="friend-actions"></div>
    </div>
</template>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/friends.js}" defer></script>
</body>
</html>
