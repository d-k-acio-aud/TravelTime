<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Time | Friends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --sidebar-width: 250px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            padding: 20px 0;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
        }

        .friends-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 25px;
            margin-bottom: 30px;
        }

        .friend-card {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s;
        }

        .friend-card:hover {
            background: #f8f9fa;
            transform: translateX(5px);
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 20px;
        }

        .friend-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-plane"></i> Travel Time
    </div>
    <nav class="nav flex-column mt-4">
        <a class="nav-link active" href="/home">
            <i class="fas fa-home"></i> Home
        </a>
        <a class="nav-link" href="/profile">
            <i class="fas fa-user"></i> Profile
        </a>
        <a class="nav-link" href="/friends">
            <i class="fas fa-users"></i> Friends
        </a>
        <a class="nav-link" href="/photos">
            <i class="fas fa-images"></i> Photos
        </a>
        <!-- В боковой панели замените форму на эту -->
        <form th:action="@{/api/auth/logout}" method="POST" class="mt-4 px-3">
            <button type="submit" class="nav-link w-100 text-start" style="background: none; border: none; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </button>
        </form>

    </nav>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Search Box -->
    <div class="search-box">
        <input type="text" class="search-input" placeholder="Search users..." id="searchInput">
        <i class="fas fa-search search-icon"></i>
    </div>

    <!-- Pending Requests -->
    <div class="friends-section" id="pendingSection">
        <h4 class="mb-4"><i class="fas fa-clock me-2"></i>Requests</h4>
        <div id="pendingList"></div>
    </div>

    <!-- Friends List -->
    <div class="friends-section">
        <h4 class="mb-4"><i class="fas fa-user-friends me-2"></i>Your Friends</h4>
        <div id="friendsList"></div>
    </div>
</div>

<!-- Templates -->
<template id="friendTemplate">
    <div class="friend-card">
        <img src="https://via.placeholder.com/50" class="friend-avatar" alt="User avatar">
        <div class="friend-info">
            <h5 class="friend-name mb-1"></h5>
            <small class="text-muted friend-username"></small>
        </div>
        <div class="friend-actions"></div>
    </div>
</template>

<!-- Bootstrap & JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/friends.js}" defer></script>
</body>
</html>
